name: Terraform Azure CI/CD

# ─────────────────────────────────────────────
# Triggers:
#   - Pull Request  → runs scan + plan + PR comment
#   - Push to main  → runs scan + plan + apply (with manual approval)
# ─────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"

env:
  TF_VERSION: "1.7.5"
  TF_WORKING_DIR: "./terraform"
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

# ─────────────────────────────────────────────
# JOB 1 ─ Security Scan with Checkov
# ─────────────────────────────────────────────
jobs:
  security-scan:
    name: "🔍 Security Scan (Checkov)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov scan on Terraform files
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: cli
          # Fail the pipeline if HIGH severity issues are found
          soft_fail: false
          # Skip specific checks if needed (comma-separated)
          # skip_check: CKV_AZURE_1,CKV_AZURE_2

      - name: Upload Checkov SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

# ─────────────────────────────────────────────
# JOB 2 ─ Terraform Plan
# ─────────────────────────────────────────────
  terraform-plan:
    name: "📋 Terraform Plan"
    runs-on: ubuntu-latest
    needs: security-scan

    # Store plan output for use in the apply job
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Login to Azure ──────────────────────
      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      # ── Create Terraform Remote Backend (Azure Storage) ──
      - name: Create Terraform Backend Storage (if not exists)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az group create \
              --name "${{ secrets.TF_BACKEND_RG }}" \
              --location "${{ secrets.TF_BACKEND_LOCATION }}" \
              --output none

            az storage account create \
              --name "${{ secrets.TF_BACKEND_SA }}" \
              --resource-group "${{ secrets.TF_BACKEND_RG }}" \
              --location "${{ secrets.TF_BACKEND_LOCATION }}" \
              --sku Standard_LRS \
              --output none

            az storage container create \
              --name "${{ secrets.TF_BACKEND_CONTAINER }}" \
              --account-name "${{ secrets.TF_BACKEND_SA }}" \
              --output none

      # ── Install Terraform ───────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Terraform Init ──────────────────────
      - name: Terraform Init
        id: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=terraform.tfstate"

      # ── Terraform Format Check ──────────────
      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      # ── Terraform Validate ──────────────────
      - name: Terraform Validate
        id: validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ── Terraform Plan ──────────────────────
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -detailed-exitcode \
            -input=false \
            2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── Save plan file as artifact ──────────
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 5

      # ── Post plan summary as PR comment ─────
      - name: Post Terraform Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');

            const fmtOutcome  = '${{ steps.fmt.outcome }}';
            const initOutcome = '${{ steps.init.outcome }}';
            const planOutcome = '${{ steps.plan.outcome }}';
            const validateOutcome = '${{ steps.validate.outcome }}';

            const statusIcon = (o) => o === 'success' ? '✅' : '❌';

            const body = `## 🏗️ Terraform Plan Results

            | Step | Status |
            |------|--------|
            | 🔧 Format    | ${statusIcon(fmtOutcome)} \`${fmtOutcome}\` |
            | 🚀 Init      | ${statusIcon(initOutcome)} \`${initOutcome}\` |
            | ✔️ Validate  | ${statusIcon(validateOutcome)} \`${validateOutcome}\` |
            | 📋 Plan      | ${statusIcon(planOutcome)} \`${planOutcome}\` |

            <details><summary>📄 Show Terraform Plan Output</summary>

            \`\`\`hcl
            ${planOutput.substring(0, 60000)}
            \`\`\`
            </details>

            > **To approve and apply:** Merge this Pull Request.
            > The deploy job requires manual approval via GitHub Environments.

            *Triggered by: @${{ github.actor }} | Commit: \`${{ github.sha }}\`*`;

            // Delete previous bot comments to keep PR clean
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.login === 'github-actions[bot]' && comment.body.includes('Terraform Plan Results')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      # ── Fail pipeline if plan failed ────────
      - name: Check Plan Exit Code
        if: steps.plan.outputs.exitcode == 1
        run: |
          echo "❌ Terraform plan failed. Review errors above."
          exit 1

# ─────────────────────────────────────────────
# JOB 3 ─ Manual Approval Gate + Terraform Apply
# Only runs on push to main (after PR merge)
# ─────────────────────────────────────────────
  terraform-apply:
    name: "🚀 Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Only deploy when merged to main, not on PR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # ⬇ This environment requires manual approval in GitHub Settings
    # Go to: Settings → Environments → "production" → add Required Reviewers
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Login to Azure ──────────────────────
      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      # ── Install Terraform ───────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Terraform Init ──────────────────────
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=terraform.tfstate"

      # ── Download saved plan ─────────────────
      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      # ── Terraform Apply ─────────────────────
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            tfplan

      - name: Azure Logout
        if: always()
        run: az logout
